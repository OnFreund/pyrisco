name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor in pyproject.toml; 3.14 is what Home Assistant runs.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install aiohttp

      - name: Run tests
        run: |
          set -o pipefail
          python -X dev -m unittest discover -s tests -v 2>&1 | tee test-output.log

      # -X dev prints leaked sockets and unretrieved task exceptions rather
      # than failing the tests that cause them.
      - name: Fail on asyncio or resource diagnostics
        run: python tests/check_diagnostics.py test-output.log
